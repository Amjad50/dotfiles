context.modules = [
    { name = libpipewire-module-echo-cancel
        flags = [ nofail ]
        args = {
            library.name = aec/libspa-aec-webrtc
            monitor.mode = true
            node.latency = 480/48000
            audio.rate = 48000
            audio.channels = 1
            audio.position = [ MONO ]
            aec.args = {
                webrtc.high_pass_filter = true
                webrtc.noise_suppression = true
                webrtc.gain_control = true
            }
            capture.props = {
                node.name     = "capture.clean_mic"
                node.passive  = true
                target.object = "bluez_input.C4:33:96:06:11:BB"
            }
            sink.props = {
                node.passive = true
            }
            source.props = {
                node.name        = "clean_mic"
                node.description = "Clean Mic"
            }
        }
    }
]
